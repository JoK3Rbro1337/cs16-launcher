appId: com.cs16launcher.app
productName: 1.6X Launcher
executableName: 16x-launcher
artifactName: '${name}-${version}.${ext}'
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron/*'
  - '!{.eslintrc.*,.prettierrc.*,tsconfig*.json,electron.vite.config.ts}'
  - '!{README.md,cs16-launcher-architecture.md,.gitignore}'
asarUnpack:
  - resources/**
publish:
  provider: github
  owner: JoK3Rbro1337
  repo: cs16-launcher
win:
  target:
    - nsis
linux:
  target:
    - AppImage
  category: Game
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
