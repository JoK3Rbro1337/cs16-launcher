appId: com.cs16launcher.app
productName: 1.6X Launcher
executableName: 16x-launcher
artifactName: '${name}-${version}.${ext}'
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron/*'
  - '!{.eslintrc.*,.prettierrc.*,tsconfig*.json,electron.vite.config.ts}'
  - '!{README.md,cs16-launcher-architecture.md,.gitignore}'
asarUnpack:
  - resources/**
publish:
  provider: github
  owner: JoK3Rbro1337
  repo: cs16-launcher
  releaseType: release
win:
  target:
    - nsis
linux:
  target:
    - AppImage
  category: Game
  # Makes the installed .desktop filename match `desktopName` (package.json), which in
  # turn matches the StartupWMClass this same helper writes into that file — and matches
  # what electron/main.ts's app.setDesktopName() call reports as the app_id at runtime.
  # Without this, the desktop entry falls back to executableName while the runtime app_id
  # is whatever Electron infers, and a mismatch is exactly what breaks xdg-activation-based
  # window raising (background notification click-to-focus, M12) on Wayland compositors.
  # See CLAUDE.md's Wayland notification-activation gotcha.
  syncDesktopName: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
